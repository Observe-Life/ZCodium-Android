name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'ci/**'
  workflow_dispatch:
    inputs:
      phone_url:
        description: '手机待填网址（带令牌）；填写后跑全功能遍历，留空则只跑基础冒烟'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses and install API 36
        run: |
          SDKMGR=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk ready"
      - name: Assemble release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Sign APK for direct install
        run: |
          set -e
          keytool -genkeypair -v -keystore ci.keystore -alias ci -keyalg RSA -keysize 2048 -validity 10000 -storepass zcodium -keypass zcodium -dname CN=ZCodium,O=ZCodium,C=CN
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 $UNSIGNED app-aligned.apk
          $BT/apksigner sign --ks ci.keystore --ks-pass pass:zcodium --key-pass pass:zcodium --out ZCodium.apk app-aligned.apk
          ls -la ZCodium.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZCodium-apk
          path: ZCodium.apk
          retention-days: 30

  emulator-test:
    name: Headless emulator test (Android 16)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZCodium-apk
      - name: Enable KVM for headless emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/emulator-run.sh "${{ github.event.inputs.phone_url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots
          retention-days: 30
