name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses and install API 36
        run: |
          SDKMGR=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk ready"
      - name: Assemble release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Sign APK for direct install
        run: |
          set -e
          keytool -genkeypair -v -keystore ci.keystore -alias ci -keyalg RSA -keysize 2048 -validity 10000 -storepass zcodium -keypass zcodium -dname CN=ZCodium,O=ZCodium,C=CN
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "unsigned=$UNSIGNED"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 $UNSIGNED app-aligned.apk
          $BT/apksigner sign --ks ci.keystore --ks-pass pass:zcodium --key-pass pass:zcodium --out ZCodium.apk app-aligned.apk
          $BT/apksigner verify --print-certs ZCodium.apk | head -3
          ls -la ZCodium.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZCodium-apk
          path: ZCodium.apk
          retention-days: 30

  emulator-test:
    name: Headless emulator smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZCodium-apk
      - name: Enable KVM for headless emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb install -r ZCodium.apk
            adb shell am start -W -n app.zcodium.remote/.MainActivity
            sleep 12
            adb shell pidof app.zcodium.remote || (adb logcat -d -t 300; exit 1)
            adb exec-out screencap -p > screenshots/01-main.png
            adb shell am start -a android.intent.action.VIEW -d 'zcode://session?sess=smoke' -n app.zcodium.remote/.MainActivity
            sleep 6
            adb exec-out screencap -p > screenshots/02-deeplink.png
            adb shell dumpsys activity activities | grep -i mResumedActivity || true
            adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime: process: app.zcodium.remote' && (echo 'crash detected'; exit 1) || echo 'no crash'
            echo 'emulator smoke test passed'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots
          retention-days: 30
